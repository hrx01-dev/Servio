name: Auto-merge Security Audit PR

on:
  workflow_run:
    workflows: ["Security Audit"]
    types:
      - completed
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_merge:
    name: Auto-merge Automated Security Report PR
    if: |
      github.event_name == 'workflow_run' || 
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'automated/security-reports')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and auto-merge Security Audit PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Searching for open Pull Request from branch: automated/security-reports..."
          
          # Query GitHub API for open pull request number from the automated reporting branch
          PR_NUMBER=$(gh pr list --head automated/security-reports --state open --json number --jq '.[0].number')
          
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "✅ No open Pull Request found for branch automated/security-reports. Nothing to merge."
            exit 0
          fi
          
          echo "🚀 Found open Pull Request #${PR_NUMBER}. Attempting approval and auto-merge..."
          
          # Attempt to approve the PR if branch protection rules require a review
          gh pr review "$PR_NUMBER" --approve || echo "ℹ️ Could not approve PR (or approval not required)."
          
          # Attempt auto-merge first (waits for required status checks like CodeQL if running).
          # If auto-merge is disabled on repo or fails, attempt immediate squash merge or standard merge.
          gh pr merge "$PR_NUMBER" --auto --squash || \
          gh pr merge "$PR_NUMBER" --squash || \
          gh pr merge "$PR_NUMBER" --merge || {
            echo "⚠️ Could not merge PR #${PR_NUMBER} automatically."
            echo "👉 Note: If repository branch protection rules require manual reviews or status checks, make sure 'Allow auto-merge' is enabled under Repository Settings -> General."
          }
