name: Security Audit

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  audit:
    name: Repo-wide Security Audit & Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Run repository security audit
        id: security_audit
        run: npm run security:check

      - name: Store security scan response (upload artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-reports/security-report.md
            security-reports/security-report.json
          if-no-files-found: ignore

      - name: Create Pull Request with Security Audit Report
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          author: Jayam Srivastava <jayamsrivastava99@gmail.com>
          committer: Jayam Srivastava <jayamsrivastava99@gmail.com>
          commit-message: "docs: update automated security audit report [skip ci]"
          branch: automated/security-reports
          title: "docs: Automated Security Audit Report Update"
          body: |
            This automated Pull Request updates the repository security audit reports in `security-reports/`.

            Generated by the scheduled security check workflow.
          labels: |
            documentation
            security
